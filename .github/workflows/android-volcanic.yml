name: Ship Ahead Android
on:
  workflow_dispatch:
    inputs:
      check_live_lobby:
        description: Test two players against the public rooms service
        type: boolean
        default: false
  pull_request:
    paths: ['src/**', 'android/**', '.github/workflows/android-volcanic.yml']
  push:
    branches: [main, fix/online-host-and-name]
    paths: ['src/**', 'android/**', '.github/workflows/android-volcanic.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build test APK and release bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -n "$UPLOAD_KEYSTORE_BASE64" ]]; then
            export UPLOAD_STORE_FILE="$RUNNER_TEMP/ship-upload.jks"
            trap 'rm -f "$UPLOAD_STORE_FILE"' EXIT
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$UPLOAD_STORE_FILE"
          fi
          gradle --no-daemon :app:assembleDebug :app:bundleRelease
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          if unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -Ei '^META-INF/.*\.(RSA|DSA|EC)$'; then
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab
            echo "Release bundle signed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release bundle unsigned" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ship-Ahead-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Verify live host and guest can enter the same room
        if: (github.event_name == 'workflow_dispatch' && inputs.check_live_lobby) || (github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'online-host-and-name'))
        shell: python
        run: |
          import json, urllib.request
          base = "https://shipahead.ashmaz.app/api/rooms"
          def send(endpoint, payload, token=""):
              req = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers={"Content-Type":"application/json","Origin":"https://shipahead.ashmaz.app","Authorization":"Bearer " + token})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          host = send(base, {"action":"create","name":"Lobby QA","color":"#2DD4BF","qtypes":["mcq"]})
          guest = send(base + "/" + host["id"], {"action":"join","name":"Guest QA","color":"#60A5FA"})
          assert len(guest["members"]) == 2 and guest["seat"] == 1
          start = send(base + "/" + host["id"], {"action":"start","rev":guest["rev"]}, host["token"])
          assert len(start["game"]["players"]) == 2
          snapshot = send(base + "/" + host["id"], {"action":"poll"}, guest["token"])
          assert snapshot["rev"] == start["rev"]
