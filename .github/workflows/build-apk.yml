name: Build Emberwake APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Emberwake-Relay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        if: contains(github.event.head_commit.message, '[capture-ui]')
        run: sudo chmod 666 /dev/kvm
      - name: Capture portrait screens
        if: contains(github.event.head_commit.message, '[capture-ui]')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          script: python3 .github/capture-ui.py
      - name: Upload portrait previews
        if: contains(github.event.head_commit.message, '[capture-ui]')
        uses: actions/upload-artifact@v4
        with:
          name: Emberwake-portrait-preview
          path: preview/*.png
          if-no-files-found: error
